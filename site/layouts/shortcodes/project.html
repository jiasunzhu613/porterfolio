<article class="project">
  <div class="project-heading">
    <div class="project-title-row">
      <h3 class="project-title">{{ .Get "title" }}</h3>
      {{- with .Get "project" }}
        <a class="project-link" href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="Visit {{ $.Get "title" }} project" title="Visit project">
          <svg class="lucide lucide-external-link" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"></path>
            <path d="M10 14 21 3"></path>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          </svg>
        </a>
      {{- end }}
      {{- with .Get "github" }}
        <a class="project-link" href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="View {{ $.Get "title" }} on GitHub" title="View on GitHub">
          <svg class="lucide lucide-github" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.28-.36 6.72-1.61 6.72-7.25A5.65 5.65 0 0 0 19.22 3.3 5.3 5.3 0 0 0 19.08.35S17.9-.03 15 1.85a13.38 13.38 0 0 0-7 0C5.1-.03 3.92.35 3.92.35a5.3 5.3 0 0 0-.14 2.95 5.65 5.65 0 0 0-1.5 3.95c0 5.63 3.44 6.88 6.72 7.25A4.8 4.8 0 0 0 8 18v4"></path>
            <path d="M8 19c-3 .92-3-1.5-4-2"></path>
          </svg>
        </a>
      {{- end }}
    </div>
    <p class="project-technologies">{{ .Get "technologies" }}</p>
  </div>
  <div class="project-description">
    {{ .Inner | markdownify }}
  </div>
</article>
