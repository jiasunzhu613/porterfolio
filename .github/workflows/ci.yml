name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  schedule:
    - cron: '17 4 * * *'
      timezone: America/Toronto
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3.2.1
      with:
        hugo-version: latest

    - name: Fetch GitHub contribution activity
      run: node scripts/fetch-github-contributions.mjs
      env:
        GITHUB_ACTIVITY_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
        GITHUB_ACTIVITY_USERNAME: jiasunzhu613

    - name: Build site
      run: |
        hugo --minify --gc --cleanDestinationDir --destination ./public --source ./site --themesDir themes --baseURL "https://jonathanzhu.com/"
        test -f ./site/public/index.html

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: ./site/public

  deploy:
    needs: build
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: ./site/public
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/public
          cname: jonathanzhu.com
