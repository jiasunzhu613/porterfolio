name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3.2.1
      with:
        hugo-version: latest

    - name: Build site
      run: |
        hugo --minify --gc --cleanDestinationDir --destination ./public --source ./site --themesDir themes--baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        test -f ./site/public/index.html

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: ./site/public

  deploy:
    needs: build
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: ./site/public
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/public
